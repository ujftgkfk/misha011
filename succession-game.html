<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Succession: Битва за Waystar Royco - Расширенное издание</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-100px) translateX(50px); }
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 1;
        }

        .game-title {
            text-align: center;
            font-size: 2.8em;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            font-size: 1.2em;
            color: #c0c0c0;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Экран выбора персонажа */
        .character-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .character-card {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .character-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            border-color: #ffd700;
        }

        .character-avatar {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .character-card h3 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .character-card p {
            color: #c0c0c0;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .character-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.85em;
            color: #ffd700;
        }

        /* Верхняя панель с меню */
        .top-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            color: #000;
        }

        .character-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(212, 175, 55, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .character-portrait {
            font-size: 2em;
        }

        .character-name-display {
            color: #d4af37;
            font-weight: bold;
        }

        /* Система статистики */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #c0c0c0;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            color: #d4af37;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #2d2d44;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37 0%, #ffd700 100%);
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Система отношений */
        .relationships-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .relationship-title {
            color: #d4af37;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-align: center;
        }

        .relationships-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .relationship-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .relationship-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .relationship-name {
            font-size: 0.8em;
            color: #c0c0c0;
            margin-bottom: 3px;
        }

        .relationship-value {
            font-size: 0.9em;
            font-weight: bold;
        }

        .relationship-positive { color: #4ade80; }
        .relationship-neutral { color: #fbbf24; }
        .relationship-negative { color: #f87171; }

        /* История и выборы */
        .story-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #d4af37;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 5px;
            min-height: 150px;
            font-size: 1.1em;
            line-height: 1.8;
            position: relative;
        }

        .scene-number {
            position: absolute;
            top: 10px;
            right: 15px;
            color: rgba(212, 175, 55, 0.5);
            font-size: 0.8em;
        }

        .timer-display {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #f87171;
            font-size: 1.2em;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .character-name {
            color: #d4af37;
            font-weight: bold;
        }

        .choices-container {
            display: grid;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            color: #fff;
            padding: 20px;
            font-size: 1.05em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .choice-btn::before {
            content: '▶';
            position: absolute;
            right: 20px;
            font-size: 1.2em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .choice-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .choice-effect {
            font-size: 0.85em;
            color: #c0c0c0;
            margin-top: 5px;
            font-style: italic;
        }

        /* Экран окончания игры */
        .game-over {
            text-align: center;
            padding: 40px;
        }

        .game-over h2 {
            font-size: 2.8em;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .achievements-display {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            margin: 10px 0;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
        }

        .achievement-icon {
            font-size: 2em;
        }

        .achievement-unlocked {
            border: 2px solid #4ade80;
        }

        .achievement-locked {
            opacity: 0.3;
        }

        .restart-btn, .menu-action-btn {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            border: none;
            color: #000;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .restart-btn:hover, .menu-action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(212, 175, 55, 0.7);
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #d4af37;
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            animation: slideIn 0.5s ease;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .info { color: #60a5fa; }

        .character-image {
            text-align: center;
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .close-modal {
            float: right;
            font-size: 1.5em;
            color: #d4af37;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #ffd700;
        }

        /* Режим игры */
        .game-mode-select {
            display: grid;
            gap: 20px;
            margin: 20px 0;
        }

        .mode-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-option:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }

        .mode-option h4 {
            color: #d4af37;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .character-select {
                grid-template-columns: 1fr;
            }

            .top-menu {
                justify-content: center;
            }
        }
    </style>
</head>

        // Инициализация частиц

        function showCharacterSelect() {

        function setGameMode(mode) {
            gameState.gameMode = mode;
            showNotification(`Режим установлен: ${mode === 'hardcore' ? 'ХАРДКОР 🔥' : 'Нормальный 🎮'}`, 'info');

        // Выбор персонажа
        function selectCharacter(charKey) {
            const char = characters[charKey];
            gameState.character = charKey;
            gameState.power = char.stats.power;
            gameState.loyalty = char.stats.loyalty;
            gameState.reputation = char.stats.reputation;
            gameState.wealth = char.stats.wealth;

            showNotification(`Вы выбрали: ${char.name} ${char.avatar}`, 'info');

            setTimeout(() => {
                startGame();
            }, 1000);
        }

        // Начало игры
        function startGame() {
            gameState.currentScene = 0;
            gameState.sceneHistory = [];
            updateStats();
            loadScene(0);
        }

        // Обновление статистики
        function updateStats() {
            gameState.power = Math.max(0, Math.min(100, gameState.power));
            gameState.loyalty = Math.max(0, Math.min(100, gameState.loyalty));
            gameState.reputation = Math.max(0, Math.min(100, gameState.reputation));
            gameState.wealth = Math.max(0, Math.min(100, gameState.wealth));

            const char = characters[gameState.character];

            let html = `

                    <div>

                        ${gameState.gameMode !== 'hardcore' ? '<button class="menu-btn" onclick="loadGame()">📂 Загрузить</button>' : ''}
                        <button class="menu-btn" onclick="showAchievements()">🏆 Достижения</button>

        function getRelationshipClass(value) {
            if (value >= 60) return 'relationship-positive';
            if (value >= 40) return 'relationship-neutral';
            return 'relationship-negative';
        }

        // Загрузка сцены
        function loadScene(sceneIndex) {
            if (sceneIndex >= scenarios.length) {
                endGame('Финал', 'История завершена!');
                return;
            }

            gameState.currentScene = sceneIndex;
            const scene = scenarios[sceneIndex];
            const char = characters[gameState.character];

            // Случайное событие
            if (gameState.randomEventsEnabled && Math.random() < 0.2 && sceneIndex > 0) {
                triggerRandomEvent();
            }

            let storyText = scene.text.replace('{CHARACTER}', char.name + ' ' + char.avatar);

            document.getElementById('story-text').innerHTML = `
                <div class="scene-number">Сцена ${sceneIndex + 1} / ${scenarios.length}</div>
                ${storyText}
            `;

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            scene.choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.innerHTML = choice.text;

                if (choice.timer) {
                    startChoiceTimer(button, choice.timer, () => makeChoice(choice));
                }

                button.onclick = () => makeChoice(choice);
                choicesContainer.appendChild(button);
            });
        }

        // Таймер для выбора
        function startChoiceTimer(button, seconds, callback) {
            let timeLeft = seconds;
            const timerDisplay = document.createElement('div');
            timerDisplay.className = 'timer-display';
            timerDisplay.textContent = `⏱️ ${timeLeft}s`;
            document.getElementById('story-text').appendChild(timerDisplay);

            const interval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `⏱️ ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerDisplay.remove();
                    callback();
                }
            }, 1000);

            button.addEventListener('click', () => {
                clearInterval(interval);
                timerDisplay.remove();
            }, { once: true });
        }

        // Сделать выбор
        function makeChoice(choice) {
            gameState.sceneHistory.push(choice.text);
            applyEffects(choice.effects, choice.relationships);

            if (!checkGameOver()) {
                setTimeout(() => {
                    updateStats();
                    loadScene(choice.nextScene);
                }, 500);
            }
        }

        // Применить эффекты
        function applyEffects(effects, relationships = {}) {
            let messages = [];
            const char = characters[gameState.character];

            for (let [stat, value] of Object.entries(effects)) {
                let modifiedValue = value;

                // Применение бонусов персонажа
                if (char.bonuses[stat]) {
                    modifiedValue = Math.round(value * char.bonuses[stat]);
                }

                gameState[stat] += modifiedValue;

                if (modifiedValue > 0) {
                    messages.push(`<span class="positive">${stat.toUpperCase()}: +${modifiedValue}</span>`);
                } else if (modifiedValue < 0) {
                    messages.push(`<span class="negative">${stat.toUpperCase()}: ${modifiedValue}</span>`);
                }
            }

            // Обновление отношений
            for (let [person, value] of Object.entries(relationships)) {
                if (gameState.relationships[person] !== undefined) {
                    gameState.relationships[person] = Math.max(0, Math.min(100, gameState.relationships[person] + value));

                    if (value > 0) {
                        messages.push(`<span class="positive">${person.toUpperCase()}: +${value}</span>`);
                    } else if (value < 0) {
                        messages.push(`<span class="negative">${person.toUpperCase()}: ${value}</span>`);
                    }
                }
            }

            if (messages.length > 0) {
                showNotification(messages.join('<br>'), 'info');
            }

            checkAchievements();
        }

        // Случайное событие
        function triggerRandomEvent() {
            const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            showNotification(`${event.icon} ${event.text}`, 'info');
            applyEffects(event.effects);
        }

        // Проверка окончания игры
        function checkGameOver() {
            if (gameState.power <= 0) {
                endGame('💔 Поражение', 'Вы потеряли всю власть. Соперники изгнали вас из компании.');
                return true;
            }

            if (gameState.loyalty <= 0) {
                endGame('🗡️ Предательство', 'Все союзники отвернулись. Одиночество в бизнесе - смерть.');
                return true;
            }

            if (gameState.reputation <= 0) {
                endGame('😱 Позор', 'Репутация уничтожена. СМИ называют вас худшим из Роев.');
                return true;
            }

            if (gameState.currentScene >= scenarios.length - 1) {
                if (gameState.power >= 70) {
                    unlockAchievement('first_victory');
                    if (gameState.gameMode === 'hardcore') {
                        unlockAchievement('hardcore_winner');
                    }
                    endGame('👑 ПОБЕДА!', `Поздравляем! Вы стали новым главой Waystar Royco!`);
                } else {
                    endGame('😐 Неоднозначный финал', 'Вы дошли до конца, но Логан выбрал другого преемника.');
                }
                return true;
            }

            return false;
        }

            const results = `
                <br><br><strong>Итоговые показатели:</strong>
                <br>⚡ Власть: ${gameState.power}

                <br>⭐ Репутация: ${gameState.reputation}
                <br>💰 Богатство: ${gameState.wealth}
                <br><br><strong>Отношения:</strong>
                <br>👴 Логан: ${gameState.relationships.logan}%
                <br>👥 Братья/Сестры: ${gameState.relationships.siblings}%
                <br>🤵 Том: ${gameState.relationships.tom}%
                <br>🧑 Грег: ${gameState.relationships.greg}%
                <br>👩‍💼 Герри: ${gameState.relationships.gerri}%
            `;

            document.getElementById('game-screen').innerHTML = `
                <div class="game-over">
                    <div class="character-image">${title.includes('ПОБЕДА') || title.includes('Победа') ? '👑' : '💔'}</div>
                    <h2>${title}</h2>
                    <p>${message}${results}</p>
                    ${getAchievementsHTML()}
                    <button class="restart-btn" onclick="restartGame()">🔄 Начать заново</button>
                    <button class="menu-action-btn" onclick="showAchievements()">🏆 Все достижения</button>
                </div>
            `;

            if (gameState.gameMode !== 'hardcore') {
                saveGameToHistory();
            }
        }

        // Достижения
        function checkAchievements() {
            if (gameState.wealth >= 100) unlockAchievement('billionaire');
            if (gameState.power >= 100) unlockAchievement('power_hungry');
            if (gameState.reputation >= 100) unlockAchievement('loved_by_all');

            if (gameState.power >= 80 && gameState.loyalty >= 80 &&
                gameState.reputation >= 80 && gameState.wealth >= 80) {
                unlockAchievement('perfect_run');
            }

            const allRelationsGood = Object.values(gameState.relationships).every(v => v >= 60);
            if (allRelationsGood) unlockAchievement('diplomat');

            const allRelationsBad = Object.values(gameState.relationships).every(v => v <= 30);
            if (allRelationsBad) unlockAchievement('betrayer');
        }

        function unlockAchievement(id) {
            if (!gameState.achievements.includes(id)) {
                gameState.achievements.push(id);
                const achievement = achievementsList.find(a => a.id === id);
                if (achievement) {
                    showNotification(`🏆 Достижение разблокировано!<br><strong>${achievement.name}</strong><br>${achievement.description}`, 'positive');
                }
                saveAchievements();
            }
        }

        function getAchievementsHTML() {
            const unlockedAchievements = achievementsList.filter(a => gameState.achievements.includes(a.id));

            if (unlockedAchievements.length === 0) return '';

            let html = '<div class="achievements-display"><h3 style="color: #d4af37; margin-bottom: 15px;">🏆 Разблокированные достижения:</h3>';

            unlockedAchievements.forEach(achievement => {
                html += `
                    <div class="achievement-item achievement-unlocked">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div>
                            <strong>${achievement.name}</strong>
                            <div style="font-size: 0.9em; color: #c0c0c0;">${achievement.description}</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        function showAchievements() {
            let html = '<div class="modal-title">🏆 Достижения</div>';
            html += '<div style="max-height: 60vh; overflow-y: auto;">';

            achievementsList.forEach(achievement => {
                const unlocked = gameState.achievements.includes(achievement.id);
                html += `
                    <div class="achievement-item ${unlocked ? 'achievement-unlocked' : 'achievement-locked'}">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div>
                            <strong>${achievement.name}</strong>
                            <div style="font-size: 0.9em; color: #c0c0c0;">${achievement.description}</div>
                        </div>
                        ${unlocked ? '<div style="color: #4ade80; margin-left: auto;">✓</div>' : ''}
                    </div>
                `;
            });

            html += '</div>';
            html += `<div style="text-align: center; margin-top: 20px; color: #d4af37;">
                Разблокировано: ${gameState.achievements.length} / ${achievementsList.length}
            </div>`;

            showModal(html);
        }

        // Сохранение и загрузка
        function saveGame() {
            if (gameState.gameMode === 'hardcore') {
                showNotification('❌ В режиме Hardcore сохранения недоступны!', 'negative');
                return;
            }

            localStorage.setItem('successionGameSave', JSON.stringify(gameState));
            showNotification('💾 Игра сохранена!', 'positive');
        }

        function loadGame() {
            if (gameState.gameMode === 'hardcore') {
                showNotification('❌ В режиме Hardcore загрузки недоступны!', 'negative');
                return;
            }

            const saved = localStorage.getItem('successionGameSave');
            if (saved) {
                gameState = JSON.parse(saved);
                updateStats();
                loadScene(gameState.currentScene);
                showNotification('📂 Игра загружена!', 'positive');
            } else {
                showNotification('❌ Нет сохраненной игры', 'negative');
            }
        }

        function saveAchievements() {
            localStorage.setItem('successionAchievements', JSON.stringify(gameState.achievements));
        }

        function loadAchievements() {
            const saved = localStorage.getItem('successionAchievements');
            if (saved) {
                gameState.achievements = JSON.parse(saved);
            }
        }

        function saveGameToHistory() {
            const history = JSON.parse(localStorage.getItem('successionGameHistory') || '[]');
            history.push({
                date: new Date().toLocaleString(),
                character: gameState.character,
                stats: {
                    power: gameState.power,
                    loyalty: gameState.loyalty,
                    reputation: gameState.reputation,
                    wealth: gameState.wealth
                }
            });
            localStorage.setItem('successionGameHistory', JSON.stringify(history.slice(-10)));
        }

        // Перезапуск
        function restartGame() {
            if (confirm('Начать новую игру? Несохраненный прогресс будет потерян.')) {
                gameState = {
                    character: null,
                    power: 50,
                    loyalty: 50,
                    reputation: 50,
                    wealth: 50,
                    currentScene: 0,
                    sceneHistory: [],
                    relationships: {
                        logan: 50,
                        siblings: 50,
                        tom: 50,
                        greg: 50,
                        gerri: 50
                    },
                    achievements: gameState.achievements,
                    gameMode: gameState.gameMode,
                    randomEventsEnabled: true
                };
                showCharacterSelect();
            }
        }

        // Уведомления
        function showNotification(text, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `<div class="${type}">${text}</div>`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 4000);
        }

        // Модальное окно
        function showModal(content) {
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Клик вне модального окна
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // Инициализация
        createParticles();
        loadAchievements();
        showCharacterSelect();
    </script>
</body>
</html>
