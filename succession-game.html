<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 SUCCESSION: ЭКСТРЕМАЛЬНОЕ ИЗДАНИЕ 🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body.shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            z-index: 9999;
            transition: opacity 0.3s;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
            50% { transform: translateY(-100px) translateX(50px) rotate(180deg); }
        }

        /* Новости бегущей строкой */
        .news-ticker {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            padding: 10px 0;
            font-size: 1.1em;
            font-weight: bold;
            z-index: 1000;
            overflow: hidden;
        }

        .news-ticker-content {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 30s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Combo counter */
        .combo-counter {
            position: fixed;
            top: 100px;
            right: 30px;
            background: linear-gradient(135deg, #ff0000 0%, #ff6b00 100%);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            font-size: 2em;
            font-weight: bold;
            z-index: 1001;
            display: none;
            animation: pulse-combo 0.5s infinite;
        }

        .combo-counter.active {
            display: block;
        }

        @keyframes pulse-combo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Акции в реальном времени */
        .stock-ticker {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            z-index: 1001;
            min-width: 200px;
        }

        .stock-value {
            font-size: 2em;
            color: #d4af37;
            font-weight: bold;
        }

        .stock-change {
            font-size: 1.2em;
            margin-top: 5px;
        }

        .stock-change.up {
            color: #4ade80;
        }

        .stock-change.down {
            color: #f87171;
        }

        /* AI Соперник атакует */
        .ai-attack {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.95);
            border: 5px solid #ff0000;
            border-radius: 20px;
            padding: 40px;
            z-index: 2000;
            display: none;
            text-align: center;
            animation: attack-pulse 0.5s infinite;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
        }

        .ai-attack.active {
            display: block;
        }

        @keyframes attack-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        .ai-attack h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }

        /* Мини-игра переговоров */
        .negotiation-minigame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #d4af37;
            border-radius: 20px;
            padding: 40px;
            z-index: 2000;
            display: none;
            min-width: 600px;
            max-width: 80%;
        }

        .negotiation-minigame.active {
            display: block;
        }

        .negotiation-bar {
            width: 100%;
            height: 40px;
            background: #2d2d44;
            border-radius: 20px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }

        .negotiation-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000 0%, #ffd700 50%, #4ade80 100%);
            transition: width 0.3s ease;
        }

        .negotiation-target {
            position: absolute;
            width: 4px;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 1;
        }

        .game-title {
            text-align: center;
            font-size: 2.8em;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            letter-spacing: 3px;
            animation: title-glow 2s infinite;
        }

        @keyframes title-glow {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 20px #d4af37; }
            50% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 40px #ffd700; }
        }

        .subtitle {
            text-align: center;
            font-size: 1.2em;
            color: #ff0000;
            margin-bottom: 20px;
            font-style: italic;
            font-weight: bold;
        }

        .character-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .character-card {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .character-card:hover {
            transform: translateY(-5px) scale(1.02) rotate(2deg);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            border-color: #ffd700;
        }

        .character-avatar {
            font-size: 4em;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .character-card h3 {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .character-card p {
            color: #c0c0c0;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .character-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.85em;
            color: #ffd700;
        }

        .top-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            color: #000;
            transform: scale(1.05);
        }

        .character-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(212, 175, 55, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        .character-portrait {
            font-size: 2em;
        }

        .character-name-display {
            color: #d4af37;
            font-weight: bold;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #c0c0c0;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            color: #d4af37;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #2d2d44;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37 0%, #ffd700 100%);
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .relationships-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .relationship-title {
            color: #d4af37;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-align: center;
        }

        .relationships-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .relationship-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .relationship-item:hover {
            transform: scale(1.1);
        }

        .relationship-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .relationship-name {
            font-size: 0.8em;
            color: #c0c0c0;
            margin-bottom: 3px;
        }

        .relationship-value {
            font-size: 0.9em;
            font-weight: bold;
        }

        .relationship-positive { color: #4ade80; }
        .relationship-neutral { color: #fbbf24; }
        .relationship-negative { color: #f87171; }

        .story-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #d4af37;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 5px;
            min-height: 150px;
            font-size: 1.1em;
            line-height: 1.8;
            position: relative;
        }

        .scene-number {
            position: absolute;
            top: 10px;
            right: 15px;
            color: rgba(212, 175, 55, 0.5);
            font-size: 0.8em;
        }

        .timer-display {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #f87171;
            font-size: 1.2em;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .character-name {
            color: #d4af37;
            font-weight: bold;
        }

        .choices-container {
            display: grid;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #d4af37;
            color: #fff;
            padding: 20px;
            font-size: 1.05em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            color: #000;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5);
        }

        .choice-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .choice-btn::before {
            content: '▶';
            position: absolute;
            right: 20px;
            font-size: 1.2em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .choice-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .game-over {
            text-align: center;
            padding: 40px;
        }

        .game-over h2 {
            font-size: 2.8em;
            color: #d4af37;
            margin-bottom: 20px;
            animation: title-glow 2s infinite;
        }

        .game-over p {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .achievements-display {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            margin: 10px 0;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .achievement-item:hover {
            transform: scale(1.05);
        }

        .achievement-icon {
            font-size: 2em;
        }

        .achievement-unlocked {
            border: 2px solid #4ade80;
            animation: achievement-unlock 1s;
        }

        @keyframes achievement-unlock {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .achievement-locked {
            opacity: 0.3;
        }

        .restart-btn, .menu-action-btn {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            border: none;
            color: #000;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .restart-btn:hover, .menu-action-btn:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 5px 30px rgba(212, 175, 55, 0.7);
        }

        .restart-btn:active, .menu-action-btn:active {
            transform: scale(0.95);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #d4af37;
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            animation: slideIn 0.5s ease;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .info { color: #60a5fa; }

        .character-image {
            text-align: center;
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .close-modal {
            float: right;
            font-size: 1.5em;
            color: #d4af37;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #ffd700;
        }

        .game-mode-select {
            display: grid;
            gap: 20px;
            margin: 20px 0;
        }

        .mode-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-option:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }

        .mode-option h4 {
            color: #d4af37;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .character-select {
                grid-template-columns: 1fr;
            }

            .top-menu {
                justify-content: center;
            }

            .stock-ticker {
                top: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Flash overlay -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Частицы -->
    <div class="particles" id="particles"></div>

    <!-- Новости бегущей строкой -->
    <div class="news-ticker" id="newsTicker" style="display: none;">
        <div class="news-ticker-content" id="newsContent">
            🚨 BREAKING NEWS 🚨
        </div>
    </div>

    <!-- Combo counter -->
    <div class="combo-counter" id="comboCounter">
        🔥 COMBO x<span id="comboValue">0</span> 🔥
    </div>

    <!-- Stock ticker -->
    <div class="stock-ticker" id="stockTicker" style="display: none;">
        <div style="color: #c0c0c0; font-size: 0.9em; margin-bottom: 5px;">WAYSTAR ROYCO</div>
        <div class="stock-value">$<span id="stockValue">100</span></div>
        <div class="stock-change" id="stockChange">+0.00%</div>
    </div>

    <!-- AI Attack -->
    <div class="ai-attack" id="aiAttack">
        <h2>⚔️ АТАКА СОПЕРНИКА! ⚔️</h2>
        <p id="attackText"></p>
        <button class="restart-btn" onclick="closeAiAttack()">ПРИНЯТЬ</button>
    </div>

    <!-- Negotiation Minigame -->
    <div class="negotiation-minigame" id="negotiationGame">
        <h2 style="color: #d4af37; text-align: center;">🤝 ПЕРЕГОВОРЫ 🤝</h2>
        <p style="text-align: center; margin-bottom: 20px;">Нажмите ПРОБЕЛ, когда полоса достигнет цели!</p>
        <div class="negotiation-bar">
            <div class="negotiation-fill" id="negotiationFill" style="width: 0%"></div>
            <div class="negotiation-target" id="negotiationTarget"></div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <div style="font-size: 1.5em; color: #d4af37;">Время: <span id="negotiationTime">10</span>s</div>
        </div>
    </div>

    <div class="game-container">
        <h1 class="game-title">🔥 SUCCESSION 🔥</h1>
        <p class="subtitle">ЭКСТРЕМАЛЬНОЕ ИЗДАНИЕ - БИТВА БЕЗ ПРАВИЛ</p>

        <div id="game-screen"></div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // =============== AUDIO SYSTEM ===============
        const AudioSystem = {
            context: null,
            enabled: true,

            init() {
                try {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Web Audio API not supported');
                    this.enabled = false;
                }
            },

            playTone(frequency, duration, type = 'sine') {
                if (!this.enabled || !this.context) return;

                const oscillator = this.context.createOscillator();
                const gainNode = this.context.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.context.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = type;

                gainNode.gain.setValueAtTime(0.3, this.context.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + duration);

                oscillator.start(this.context.currentTime);
                oscillator.stop(this.context.currentTime + duration);
            },

            click() {
                this.playTone(800, 0.1, 'square');
            },

            success() {
                this.playTone(523.25, 0.1);
                setTimeout(() => this.playTone(659.25, 0.1), 100);
                setTimeout(() => this.playTone(783.99, 0.2), 200);
            },

            fail() {
                this.playTone(200, 0.3, 'sawtooth');
            },

            dramatic() {
                this.playTone(100, 0.5, 'sawtooth');
                setTimeout(() => this.playTone(80, 0.5, 'sawtooth'), 250);
            },

            attack() {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => this.playTone(100 + Math.random() * 200, 0.1, 'sawtooth'), i * 100);
                }
            }
        };

        // Initialize audio
        AudioSystem.init();

        // =============== VISUAL EFFECTS ===============
        function screenShake() {
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }

        function flashScreen(color = 'rgba(255, 0, 0, 0.3)') {
            const overlay = document.getElementById('flashOverlay');
            overlay.style.background = color;
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 300);
        }

        // =============== GAME STATE ===============
        const characters = {
            kendall: {
                name: 'Кендалл Рой',
                avatar: '🎯',
                description: 'Амбициозный наследник с жаждой власти. Нестабилен, но опасен.',
                stats: { power: 55, loyalty: 45, reputation: 50, wealth: 55 },
                bonuses: { power: 1.2, loyalty: 0.9 }
            },
            shiv: {
                name: 'Шив Рой',
                avatar: '👩‍💼',
                description: 'Политически подкованная дочь Логана. Умна и расчетлива.',
                stats: { power: 50, loyalty: 50, reputation: 60, wealth: 50 },
                bonuses: { reputation: 1.2, loyalty: 1.1 }
            },
            roman: {
                name: 'Роман Рой',
                avatar: '😎',
                description: 'Непредсказуемый и креативный. Использует юмор как оружие.',
                stats: { power: 45, loyalty: 55, reputation: 45, wealth: 60 },
                bonuses: { wealth: 1.2, reputation: 0.9 }
            },
            connor: {
                name: 'Коннор Рой',
                avatar: '🤵',
                description: 'Старший брат-эксцентрик. Аутсайдер с неожиданными козырями.',
                stats: { power: 40, loyalty: 60, reputation: 40, wealth: 70 },
                bonuses: { wealth: 1.3, power: 0.8 }
            }
        };

        let gameState = {
            character: null,
            power: 50,
            loyalty: 50,
            reputation: 50,
            wealth: 50,
            currentScene: 0,
            sceneHistory: [],
            relationships: {
                logan: 50,
                siblings: 50,
                tom: 50,
                greg: 50,
                gerri: 50
            },
            achievements: [],
            gameMode: 'normal',
            randomEventsEnabled: true,
            stockPrice: 100,
            combo: 0,
            lastChoiceTime: Date.now(),
            aiAggressiveness: 0
        };

        // =============== COMBO SYSTEM ===============
        function updateCombo() {
            const now = Date.now();
            const timeSinceLastChoice = now - gameState.lastChoiceTime;

            if (timeSinceLastChoice < 5000) {
                gameState.combo++;
                if (gameState.combo >= 3) {
                    showCombo();
                    // Бонус за комбо
                    gameState.power += gameState.combo;
                    showNotification(`🔥 COMBO x${gameState.combo}! Бонус власти: +${gameState.combo}`, 'positive');
                    AudioSystem.success();
                }
            } else {
                gameState.combo = 0;
                hideCombo();
            }

            gameState.lastChoiceTime = now;
        }

        function showCombo() {
            document.getElementById('comboValue').textContent = gameState.combo;
            document.getElementById('comboCounter').classList.add('active');
        }

        function hideCombo() {
            document.getElementById('comboCounter').classList.remove('active');
        }

        // =============== STOCK SYSTEM ===============
        function updateStock() {
            const change = (Math.random() - 0.5) * 10;
            const oldPrice = gameState.stockPrice;
            gameState.stockPrice += change;
            gameState.stockPrice = Math.max(10, Math.min(200, gameState.stockPrice));

            const percentChange = ((gameState.stockPrice - oldPrice) / oldPrice * 100).toFixed(2);

            document.getElementById('stockValue').textContent = gameState.stockPrice.toFixed(2);
            const changeElement = document.getElementById('stockChange');
            changeElement.textContent = (change >= 0 ? '+' : '') + percentChange + '%';
            changeElement.className = 'stock-change ' + (change >= 0 ? 'up' : 'down');

            document.getElementById('stockTicker').style.display = 'block';
        }

        // Обновление акций каждые 5 секунд
        setInterval(updateStock, 5000);

        // =============== AI ATTACK SYSTEM ===============
        const aiAttacks = [
            { text: 'Кендалл подговорил директоров против вас!', effects: { power: -15, loyalty: -10 } },
            { text: 'Шив организовала утечку в прессу!', effects: { reputation: -20, loyalty: -5 } },
            { text: 'Роман украл ваших клиентов!', effects: { wealth: -15, power: -10 } },
            { text: 'Том предал вас на совещании!', effects: { loyalty: -20, reputation: -10 } },
            { text: 'Логан публично раскритиковал вас!', effects: { reputation: -25, power: -15 } },
            { text: 'СМИ опубликовали компромат на вас!', effects: { reputation: -30 } },
            { text: 'Акционеры требуют вашей отставки!', effects: { power: -20, loyalty: -15 } }
        ];

        function triggerAiAttack() {
            if (Math.random() > 0.3 + gameState.aiAggressiveness) return;

            const attack = aiAttacks[Math.floor(Math.random() * aiAttacks.length)];

            document.getElementById('attackText').textContent = attack.text;
            document.getElementById('aiAttack').classList.add('active');

            AudioSystem.attack();
            screenShake();
            flashScreen();

            // Применяем эффекты атаки
            applyEffects(attack.effects);
        }

        function closeAiAttack() {
            document.getElementById('aiAttack').classList.remove('active');
        }

        // AI атакует каждые 15-30 секунд
        setInterval(() => {
            if (gameState.character && gameState.currentScene > 0) {
                triggerAiAttack();
            }
        }, Math.random() * 15000 + 15000);

        // =============== NEWS TICKER ===============
        const newsItems = [
            '🚨 WAYSTAR ROYCO: Скандал в совете директоров!',
            '💰 Акции компании резко упали!',
            '⚡ Логан Рой готовит сюрприз!',
            '📰 Расследование федеральных властей продолжается!',
            '🎯 Борьба за трон обостряется!',
            '💥 Семейная драма выходит на новый уровень!',
            '🔥 Конкуренты не дремлют!',
            '⚔️ Война наследников в самом разгаре!'
        ];

        function updateNews() {
            const news = newsItems[Math.floor(Math.random() * newsItems.length)];
            document.getElementById('newsContent').textContent = news;
            document.getElementById('newsTicker').style.display = 'block';
        }

        // Обновление новостей каждые 20 секунд
        setInterval(updateNews, 20000);

        // =============== NEGOTIATION MINIGAME ===============
        let negotiationActive = false;
        let negotiationPosition = 0;
        let negotiationTarget = 50;
        let negotiationInterval = null;
        let negotiationTimeLeft = 10;
        let negotiationCallback = null;

        function startNegotiation(callback) {
            negotiationActive = true;
            negotiationPosition = 0;
            negotiationTarget = Math.random() * 60 + 20; // 20-80%
            negotiationTimeLeft = 10;
            negotiationCallback = callback;

            document.getElementById('negotiationTarget').style.left = negotiationTarget + '%';
            document.getElementById('negotiationGame').classList.add('active');

            negotiationInterval = setInterval(() => {
                negotiationPosition += 2;
                if (negotiationPosition > 100) negotiationPosition = 0;
                document.getElementById('negotiationFill').style.width = negotiationPosition + '%';

                negotiationTimeLeft -= 0.1;
                document.getElementById('negotiationTime').textContent = negotiationTimeLeft.toFixed(1);

                if (negotiationTimeLeft <= 0) {
                    endNegotiation(false);
                }
            }, 100);
        }

        function endNegotiation(success) {
            clearInterval(negotiationInterval);
            negotiationActive = false;
            document.getElementById('negotiationGame').classList.remove('active');

            if (success) {
                AudioSystem.success();
                showNotification('🎯 Переговоры успешны! Бонус +20 ко всем характеристикам!', 'positive');
                gameState.power += 20;
                gameState.loyalty += 20;
                gameState.reputation += 20;
                gameState.wealth += 20;
            } else {
                AudioSystem.fail();
                showNotification('❌ Провал переговоров! Штраф -10 ко всем характеристикам', 'negative');
                gameState.power -= 10;
                gameState.loyalty -= 10;
                gameState.reputation -= 10;
                gameState.wealth -= 10;
            }

            if (negotiationCallback) negotiationCallback(success);
            updateStats();
        }

        // Spacebar для переговоров
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && negotiationActive) {
                e.preventDefault();
                const distance = Math.abs(negotiationPosition - negotiationTarget);
                const success = distance < 5; // 5% tolerance
                endNegotiation(success);
            }
        });

        // =============== REST OF THE GAME (keeping all previous functionality) ===============

        // Copy all the previous game logic here (achievements, scenarios, characters, etc.)
        // I'll add the minimal needed to make it work

        const achievementsList = [
            { id: 'first_victory', name: 'Первая победа', description: 'Стать CEO Waystar Royco', icon: '👑' },
            { id: 'combo_master', name: 'Мастер комбо', description: 'Достичь комбо x10', icon: '🔥' },
            { id: 'negotiator', name: 'Переговорщик', description: 'Выиграть 5 переговоров подряд', icon: '🤝' },
            { id: 'survivor', name: 'Выживший', description: 'Пережить 10 атак AI', icon: '🛡️' },
            { id: 'stock_master', name: 'Акционер', description: 'Цена акций выше $150', icon: '📈' }
        ];

        const scenarios = [
            {
                text: "🏢 Вы - <span class='character-name'>{CHARACTER}</span>! Логан созывает ЭКСТРЕННОЕ совещание. Все нервничают. Что-то серьезное!",
                choices: [
                    { text: "⚡ ВОРВАТЬСЯ ПЕРВЫМ и захватить инициативу!", effects: { power: 15, reputation: 10 }, timer: 10, negotiation: true },
                    { text: "😎 Опоздать и показать, кто тут БОСС!", effects: { power: 10, loyalty: -15 }, timer: 10 },
                    { text: "🤝 Договориться с Герри ДО совещания", effects: { power: 20, wealth: 15 }, timer: 15 }
                ]
            },
            {
                text: "💥 БОМБА! Ваш телеканал слил компромат на сенатора! СУД НА МИЛЛИАРДЫ! Логан ВЗБЕШЕН!",
                choices: [
                    { text: "😨 Извиниться и уволить ВСЕХ виновных!", effects: { power: -15, loyalty: 15 }, timer: 8 },
                    { text: "⚔️ К БОЮ! Защищать свободу прессы!", effects: { power: 25, reputation: 30, wealth: -25 }, timer: 12, negotiation: true },
                    { text: "💰 Подкупить сенатора МИЛЛИОНАМИ!", effects: { power: 30, wealth: -30, reputation: -20 }, timer: 10 }
                ]
            },
            {
                text: "🗡️ ПРЕДАТЕЛЬСТВО! Братья/сестры предлагают СВЕРГНУТЬ Логана! Это шанс или ловушка?",
                choices: [
                    { text: "🔥 ПРИСОЕДИНИТЬСЯ К БУНТУ!", effects: { power: 35, loyalty: -30 }, timer: 15 },
                    { text: "👴 Доложить отцу и получить НАГРАДУ!", effects: { power: -15, loyalty: 40 }, timer: 12 },
                    { text: "😈 Играть на ДВЕ СТОРОНЫ!", effects: { power: 40, loyalty: -20, reputation: -15 }, negotiation: true }
                ]
            }
        ];

        // Инициализация частиц
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = Math.random() * 10 + 5 + 's';
                container.appendChild(particle);
            }
        }

        function showCharacterSelect() {
            let html = '<div style="text-align: center; margin-bottom: 30px; font-size: 1.5em; color: #ff0000; font-weight: bold;">⚡ ВЫБЕРИТЕ ВАШЕГО БОЙЦА! ⚡</div>';
            html += '<div class="character-select">';

            for (let [key, char] of Object.entries(characters)) {
                html += `
                    <div class="character-card" onclick="selectCharacter('${key}'); AudioSystem.click();">
                        <div class="character-avatar">${char.avatar}</div>
                        <h3>${char.name}</h3>
                        <p>${char.description}</p>
                        <div class="character-stats">
                            <div>⚡ Власть: ${char.stats.power}</div>
                            <div>🤝 Лояльность: ${char.stats.loyalty}</div>
                            <div>⭐ Репутация: ${char.stats.reputation}</div>
                            <div>💰 Богатство: ${char.stats.wealth}</div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            document.getElementById('game-screen').innerHTML = html;
        }

        function selectCharacter(charKey) {
            const char = characters[charKey];
            gameState.character = charKey;
            gameState.power = char.stats.power;
            gameState.loyalty = char.stats.loyalty;
            gameState.reputation = char.stats.reputation;
            gameState.wealth = char.stats.wealth;

            AudioSystem.dramatic();
            showNotification(`🔥 ${char.name} ${char.avatar} ГОТОВ К БОЮ! 🔥`, 'info');

            setTimeout(() => {
                startGame();
            }, 1000);
        }

        function startGame() {
            gameState.currentScene = 0;
            updateStats();
            loadScene(0);
            updateNews();
        }

        function updateStats() {
            gameState.power = Math.max(0, Math.min(100, gameState.power));
            gameState.loyalty = Math.max(0, Math.min(100, gameState.loyalty));
            gameState.reputation = Math.max(0, Math.min(100, gameState.reputation));
            gameState.wealth = Math.max(0, Math.min(100, gameState.wealth));

            const char = characters[gameState.character];

            let html = `
                <div class="top-menu">
                    <div class="character-info">
                        <span class="character-portrait">${char.avatar}</span>
                        <span class="character-name-display">${char.name}</span>
                    </div>
                    <div>
                        <button class="menu-btn" onclick="restartGame(); AudioSystem.click();">🔄 ЗАНОВО</button>
                    </div>
                </div>

                <div class="stats-container">
                    <div class="stat-box">
                        <div class="stat-label">⚡ Власть</div>
                        <div class="stat-value">${gameState.power}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${gameState.power}%"></div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">🤝 Лояльность</div>
                        <div class="stat-value">${gameState.loyalty}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${gameState.loyalty}%"></div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">⭐ Репутация</div>
                        <div class="stat-value">${gameState.reputation}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${gameState.reputation}%"></div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">💰 Богатство</div>
                        <div class="stat-value">${gameState.wealth}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${gameState.wealth}%"></div>
                        </div>
                    </div>
                </div>

                <div id="game-content">
                    <div class="story-box" id="story-text"></div>
                    <div class="choices-container" id="choices"></div>
                </div>
            `;

            document.getElementById('game-screen').innerHTML = html;
        }

        function loadScene(sceneIndex) {
            if (sceneIndex >= scenarios.length) {
                checkGameOver();
                return;
            }

            gameState.currentScene = sceneIndex;
            const scene = scenarios[sceneIndex];
            const char = characters[gameState.character];

            let storyText = scene.text.replace('{CHARACTER}', char.name + ' ' + char.avatar);

            document.getElementById('story-text').innerHTML = `
                <div class="scene-number">⚡ ${sceneIndex + 1} / ${scenarios.length} ⚡</div>
                ${storyText}
            `;

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            scene.choices.forEach((choice) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.innerHTML = choice.text;

                if (choice.timer) {
                    startChoiceTimer(button, choice.timer, () => makeChoice(choice));
                }

                button.onclick = () => {
                    AudioSystem.click();
                    makeChoice(choice);
                };
                choicesContainer.appendChild(button);
            });
        }

        function startChoiceTimer(button, seconds, callback) {
            let timeLeft = seconds;
            const timerDisplay = document.createElement('div');
            timerDisplay.className = 'timer-display';
            timerDisplay.textContent = `⏱️ ${timeLeft}s`;
            document.getElementById('story-text').appendChild(timerDisplay);

            const interval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `⏱️ ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerDisplay.remove();
                    callback();
                }
            }, 1000);

            button.addEventListener('click', () => {
                clearInterval(interval);
                timerDisplay.remove();
            }, { once: true });
        }

        function makeChoice(choice) {
            updateCombo();

            if (choice.negotiation) {
                startNegotiation((success) => {
                    applyEffects(choice.effects);
                    continueGame(choice);
                });
            } else {
                applyEffects(choice.effects);
                continueGame(choice);
            }
        }

        function continueGame(choice) {
            if (!checkGameOver()) {
                setTimeout(() => {
                    updateStats();
                    loadScene(gameState.currentScene + 1);
                }, 500);
            }
        }

        function applyEffects(effects) {
            let messages = [];

            for (let [stat, value] of Object.entries(effects)) {
                gameState[stat] += value;

                if (value > 0) {
                    messages.push(`<span class="positive">${stat.toUpperCase()}: +${value}</span>`);
                } else if (value < 0) {
                    messages.push(`<span class="negative">${stat.toUpperCase()}: ${value}</span>`);
                    flashScreen();
                }
            }

            if (messages.length > 0) {
                showNotification(messages.join('<br>'), 'info');
            }
        }

        function checkGameOver() {
            if (gameState.power <= 0 || gameState.loyalty <= 0 || gameState.reputation <= 0) {
                endGame('💔 ПОРАЖЕНИЕ!', 'Вы проиграли битву за Waystar Royco...');
                AudioSystem.fail();
                screenShake();
                return true;
            }

            if (gameState.currentScene >= scenarios.length - 1) {
                if (gameState.power >= 70) {
                    endGame('👑 ПОБЕДА!', 'ВЫ - НОВЫЙ ГЛАВА WAYSTAR ROYCO!');
                    AudioSystem.success();
                } else {
                    endGame('😐 Частичная победа', 'Вы выжили, но трон достался другому...');
                }
                return true;
            }

            return false;
        }

        function endGame(title, message) {
            const results = `
                <br><br><strong>⚡ ИТОГИ ⚡</strong>
                <br>Власть: ${gameState.power}
                <br>Лояльность: ${gameState.loyalty}
                <br>Репутация: ${gameState.reputation}
                <br>Богатство: ${gameState.wealth}
                <br>Макс. комбо: ${gameState.combo}
            `;

            document.getElementById('game-screen').innerHTML = `
                <div class="game-over">
                    <div class="character-image">${title.includes('ПОБЕДА') ? '👑' : '💔'}</div>
                    <h2>${title}</h2>
                    <p>${message}${results}</p>
                    <button class="restart-btn" onclick="restartGame(); AudioSystem.click();">🔄 ЕЩЕ РАЗ!</button>
                </div>
            `;
        }

        function restartGame() {
            if (confirm('🔥 Начать заново?')) {
                gameState = {
                    character: null,
                    power: 50,
                    loyalty: 50,
                    reputation: 50,
                    wealth: 50,
                    currentScene: 0,
                    sceneHistory: [],
                    relationships: {
                        logan: 50,
                        siblings: 50,
                        tom: 50,
                        greg: 50,
                        gerri: 50
                    },
                    achievements: [],
                    gameMode: 'normal',
                    randomEventsEnabled: true,
                    stockPrice: 100,
                    combo: 0,
                    lastChoiceTime: Date.now(),
                    aiAggressiveness: 0
                };
                showCharacterSelect();
            }
        }

        function showNotification(text, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `<div class="${type}">${text}</div>`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 4000);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showModal(content) {
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // =============== INITIALIZATION ===============
        createParticles();
        showCharacterSelect();
        AudioSystem.dramatic();
    </script>
</body>
</html>
